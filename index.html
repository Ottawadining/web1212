<style>
  :root {
    --bg: #0b0a08;
    --ink: #ece6d8;
    --mute: rgba(236, 230, 216, .55);
    --faint: rgba(236, 230, 216, .28);
    --line: rgba(236, 230, 216, .14);
    --out: cubic-bezier(.16, 1, .3, 1);
    --ease: cubic-bezier(.7, 0, .2, 1);
    --pad: clamp(16px, 2.4vw, 32px);
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); color: var(--ink); }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
    padding: var(--pad);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
    background: radial-gradient(60% 55% at 50% 46%, #1b1812 0%, #100e0b 50%, var(--bg) 85%) fixed;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; }

  .plaque { width: min(100%, 920px); text-align: center; }

  /* wordmark */
  h1 { display: flex; justify-content: center; overflow: hidden; font-weight: 400; font-size: clamp(44px, 9vw, 104px); letter-spacing: .02em; line-height: 1; padding-bottom: .04em; }
  h1 span { display: block; transform: translateY(105%); animation: rise 1.2s var(--out) forwards; }
  h1 span:nth-child(2) { animation-delay: .07s; } h1 span:nth-child(3) { animation-delay: .14s; }
  h1 span:nth-child(4) { animation-delay: .21s; } h1 span:nth-child(5) { animation-delay: .28s; }
  h1 span:nth-child(6) { animation-delay: .35s; }

  .tag { margin-top: clamp(14px, 2vh, 22px); font-size: clamp(12px, 1.2vw, 14px); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); opacity: 0; animation: fade 1s var(--out) .7s forwards; }

  .rule { height: 1px; margin: clamp(40px, 7vh, 72px) 0 clamp(28px, 4.5vh, 44px); background: var(--line); transform: scaleX(0); animation: draw 1.4s var(--ease) .9s forwards; }

  .domain { font-size: clamp(16px, 1.6vw, 19px); font-weight: 300; letter-spacing: .01em; opacity: 0; animation: fade 1s var(--out) 1.3s forwards; }

  /* the cities */
  .cities { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px clamp(18px, 2.6vw, 30px); margin-top: clamp(16px, 2.4vh, 22px); }
  .cities li { opacity: 0; transform: translateY(8px); animation: settle .9s var(--out) forwards; animation-delay: calc(1.45s + var(--i) * .08s); }
  .cities a, .cities .soon { position: relative; display: inline-block; padding: 8px 0; font: 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .cities a { color: var(--ink); }
  .cities a::after { content: ''; position: absolute; left: 0; right: 0; bottom: 3px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform .6s var(--ease); }
  .cities a:hover::after, .cities a:focus-visible::after { transform: scaleX(1); transform-origin: left; }
  .cities .soon { color: var(--faint); cursor: default; }
  .cities .soon small { position: absolute; left: 50%; top: 100%; transform: translate(-50%, -2px); font: 9px var(--mono); letter-spacing: .14em; white-space: nowrap; color: var(--faint); opacity: 0; transition: opacity .4s; }
  .cities .soon:hover small { opacity: 1; }
  @media (hover: none) { .cities .soon small { opacity: 1; } .cities { row-gap: 22px; } }

  @keyframes rise { to { transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes settle { to { opacity: 1; transform: none; } }
  @keyframes draw { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  }
</style>

<main class="plaque">

  <div class="rule" aria-hidden="true"></div>
  <p class="domain">plated.gallery</p>
  <nav aria-label="Cities">
    <ul class="cities">
      <!-- Ottawa moves to /ottawa/ later; until then it lives at ottawaplated.com -->
      <li style="--i:0"><a href="https://ottawaplated.com/">Ottawa</a></li>
      <li style="--i:1"><a href="/toronto/">Toronto</a></li>
      <li style="--i:2"><span class="soon">Montréal<small>Soon</small></span></li>
      <li style="--i:3"><span class="soon">New York<small>Soon</small></span></li>
    </ul>
  </nav>
</main>
